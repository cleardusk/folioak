name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package macOS arm64
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain and version
        id: toolchain
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.2
          xcrun swiftc --version
          toolchain_key=$({ xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "media-key=$toolchain_key" >> "$GITHUB_OUTPUT"
          plutil -lint Resources/Info.plist
          if [[ "$REF_TYPE" == tag ]]; then
            version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$REF_NAME" = "v$version"
          fi
      - name: Cache media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/media-tools
          key: media-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.media-key }}-${{ hashFiles('Tools/prepare-media.py', 'Tools/QuickJSHost.c', 'Resources/MediaComponents.md', 'Resources/Downloader.entitlements') }}
          # Use an exact recipe match; prepare-media.py still verifies file hashes.
      - name: Prepare verified media tools
        run: python3 Tools/prepare-media.py
      - name: Run offline regression and resource tests
        run: ./test.command --stress
      - name: Package app
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./package.command
      - name: Upload packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: |
            dist/Leafpick-*-macos-arm64.zip
            dist/Leafpick-*-macos-arm64.dmg
            dist/leafpick-cli-*-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          asset_name="Leafpick-$RELEASE_TAG-macos-arm64"
          cli_asset="leafpick-cli-$RELEASE_TAG-macos-arm64"
          test -f "$asset_name.zip"
          test -f "$asset_name.dmg"
          test -f "$cli_asset.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; published assets will not be overwritten.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$asset_name.zip" "$asset_name.dmg" "$cli_asset.zip" SHA256SUMS.txt \
            --draft --verify-tag --target "$RELEASE_COMMIT" --title "拾取 · Leafpick $RELEASE_TAG" \
            --notes-file ../.github/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
